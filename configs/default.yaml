source:
  type: file
  path: data/videos/demo.mp4

tracker:
  name: yolo
  params:
    model_name: yolo26n.pt
    tracker: bytetrack.yaml
    conf: 0.25
    iou: 0.7
    classes: [0, 2]
    device: auto

counters:
  - name: main_line
    type: line
    params:
      start: [0.5, 0.0]
      end: [0.5, 1.0]
      classes_of_interest: [person, car]

sinks:
  display:
    enabled: true
  video:
    enabled: false
    path: outputs/annotated.mp4
  stats:
    enabled: false
    format: csv
    path: outputs/counts.csv
