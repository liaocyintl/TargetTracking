source:
  type: camera
  device_id: 0

tracker:
  name: yolo
  params:
    model_name: yolo26n.pt
    tracker: bytetrack.yaml
    classes: [0]
    device: auto

counters:
  - name: doorway
    type: line
    params:
      start: [300, 400]
      end: [900, 400]
      classes_of_interest: [person]

sinks:
  display: { enabled: true }
  video: { enabled: false }
  stats: { enabled: true, format: json, path: outputs/people.json }
